[package]
name = "salobj"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
apache-avro = "0.22.0"
base_topic_derive = {path = "../base_topic_derive"}
handle_command = {path = "../handle_command"}
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
num-traits = "0.2.19"
schema_registry_converter = { version = "5.1.0", features = ["avro"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde-xml-rs = "0.8.2"
tokio = { version = "1.53.3", features = ["full"] }
whoami = "2.1.3"
log = "0.4.34"
simple_logger = "5.2.0"
rand = "0.10.3"
futures = "0.3.34"
rdkafka = { version = "0.40.0", features = ["cmake-build", "ssl"] }
miniz_oxide = "0.9.1"

[dev-dependencies]
num-bigint = "0.5"
